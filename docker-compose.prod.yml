# Production deployment - standalone, does NOT require dev services
# Run with: docker-compose -f docker-compose.prod.yml up --build -d

services:
  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: pqc-production
    ports:
      - "8080:80"
      - "5001:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      - RATELIMIT_STORAGE_URL=memory://
      - CORS_ORIGINS=http://localhost:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pqc-network

networks:
  pqc-network:
    driver: bridge
