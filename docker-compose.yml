services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pqc-backend
    ports:
      - "5000:5000"
    volumes:
      - backend_data:/app/backend/instance
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-prod}
      - DATABASE_URL=sqlite:///pqc_password_manager.db
      - RATELIMIT_STORAGE_URL=memory://
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LD_LIBRARY_PATH=/usr/local/lib
      - PYTHONUNBUFFERED=1
    working_dir: /app/backend
    command: sh -c "ldconfig && python app.py"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5); sys.exit(0)"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pqc-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: pqc-frontend
    volumes:
      - ./frontend:/app/frontend
      - node_modules:/app/frontend/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    working_dir: /app/frontend
    command: npm start
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit((r.statusCode || 500) < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pqc-network

  pqc-selftest:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: pqc-selftest
    working_dir: /app/backend
    command: python -c "from utils.pqc import PQCKeyManager; import sys; print('PQC self-test:', PQCKeyManager.self_test()); sys.exit(0 if PQCKeyManager.self_test() else 1)"
    profiles:
      - test
      - pqc
    networks:
      - pqc-network

  # Test runner - run with: docker-compose run --rm test
  test:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    container_name: pqc-test
    working_dir: /app
    volumes:
      - ./tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CI=true
    command: sh -c "npm init -y && npm install @playwright/test && npx playwright test --reporter=list"
    depends_on:
      frontend:
        condition: service_healthy
    profiles:
      - test
    networks:
      - pqc-network

networks:
  pqc-network:
    driver: bridge

volumes:
  backend_data:
  node_modules:
