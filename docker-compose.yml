# Docker Compose for PQC Password Manager Backend
# Run with: docker-compose up --build -d
# The frontend runs separately with npm (npm start in frontend directory)

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pqc-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
    working_dir: /app/backend
    command: python app.py
    networks:
      - pqc-network

networks:
  pqc-network:
    driver: bridge
